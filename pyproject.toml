[project]
name = "jarvis"
version = "0.2.0.dev0"
description = "Falak: personal assistant (code name jarvis)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "claude-agent-sdk>=0.2.174,<0.3",
    "discord-py>=2.7,<3",
    "pyobjc-framework-quartz>=10 ; sys_platform == 'darwin'",
    "websockets>=15,<16",
]

[project.optional-dependencies]
dev = ["pytest>=8", "numpy>=1.26"]  # numpy: the speech tests build and resample audio
# M9, the host's voice: Kokoro on MLX (no torch), faster-whisper for listening, and misaki's English dictionary with
# the spaCy model it needs (misaki would otherwise try to pip-install it at run time).
voice = [
    "mlx-audio>=0.6,<0.7 ; sys_platform == 'darwin'",
    "misaki[en]>=0.9",
    "faster-whisper>=1.2,<2",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
# M9, the desk on the node: the wake word and speech detection (openwakeword bundles the Silero VAD model).
desk = ["openwakeword>=0.6,<0.7 ; sys_platform == 'darwin'", "onnxruntime>=1.18", "numpy>=1.26"]

# M10, Falak's browser on the node: Playwright drives Chromium (installed by `falak browser setup` into the node's folder).
browser = ["playwright>=1.49,<2"]

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests", "jarvis/apps"]

[tool.uv]
environments = ["sys_platform == 'darwin'"]  # Falak is macOS only (pyobjc, MLX, the desk helper); openwakeword has no Linux wheels for 3.13

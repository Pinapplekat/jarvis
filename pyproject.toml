[project]
name = "jarvis"
version = "0.2.0.dev0"
description = "Falak: personal assistant (code name jarvis)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "claude-agent-sdk>=0.2.174,<0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests", "jarvis/apps"]

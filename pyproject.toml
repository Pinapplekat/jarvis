[project]
name = "jarvis"
version = "0.1.0"
description = "Personal assistant: memory, school/work/money awareness, approved email, phone alerts"
requires-python = ">=3.11"
dependencies = [
    "msal>=1.28",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

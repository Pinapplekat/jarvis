[project]
name = "jarvis"
version = "0.1.0"
description = "Personal assistant: memory, school/work/money awareness, approved email, phone alerts"
requires-python = ">=3.11"
dependencies = [
    "msal>=1.28",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "icalendar>=6",
    "playwright>=1.47",
    "pyobjc-framework-vision>=10",
    "pyobjc-framework-quartz>=10",
    "faster-whisper>=1.0",
    "sounddevice>=0.4",
    "openwakeword>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Kokoro-82M voice (kokoro-onnx doesn't support Python 3.14 yet; there JARVIS uses macOS `say`)
kokoro = ["kokoro-onnx>=0.4; python_version < '3.14'", "soundfile>=0.12; python_version < '3.14'"]

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

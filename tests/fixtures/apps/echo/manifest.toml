[app]
name = "echo"
description = "Test app covering every effect."
context = "context"

[[actions]]
name = "shout"
description = "Upper-case some text."
effect = "read"
[actions.input]
type = "object"
required = ["text"]
additionalProperties = false
[actions.input.properties.text]
type = "string"

[[actions]]
name = "note"
description = "Store a note."
effect = "local"
undo = "unnote"
[actions.input]
type = "object"
required = ["text"]
additionalProperties = false
[actions.input.properties.text]
type = "string"

[[actions]]
name = "send"
description = "Send text to someone."
effect = "outbound"
confirm = "Send {text} to {to}?"
log_args = false
[actions.input]
type = "object"
required = ["text", "to"]
additionalProperties = false
[actions.input.properties.text]
type = "string"
[actions.input.properties.to]
type = "string"
[actions.input.properties.times]
type = "integer"
default = 1
minimum = 1

[[actions]]
name = "wipe"
description = "Wipe something for good."
effect = "irreversible"
confirm = "Wipe {what}?"
[actions.input]
type = "object"
required = ["what"]
additionalProperties = false
[actions.input.properties.what]
type = "string"

[[actions]]
name = "photo"
description = "Hand back a temp file."
effect = "read"
untrusted_output = true
[actions.input]
type = "object"
additionalProperties = false

[[actions]]
name = "boom"
description = "Always crashes."
effect = "read"
[actions.input]
type = "object"
additionalProperties = false

[[actions]]
name = "project"
description = "Start a long job the user wants to steer."
effect = "plan"
confirm = "Here's my plan: {plan}. Go?"
[actions.input]
type = "object"
required = ["plan"]
additionalProperties = false
[actions.input.properties.plan]
type = "string"

[[actions]]
name = "fetch"
description = "Read a page (its address leaves the device)."
effect = "read"
untrusted_output = true
sends_data = true
confirm = "Open {url}?"
[actions.input]
type = "object"
required = ["url"]
additionalProperties = false
[actions.input.properties.url]
type = "string"

[app]
name = "reminders"
description = "Reminders: 'remind me at 3 to call the bank' arrives at 3:00 on the dot."
runs_on = "host"
context = "context"

[[actions]]
name = "remind_me"
description = "Remind Elijah of something at a time. `at` is the local time as ISO 8601 with its UTC offset, e.g. 2026-10-26T15:00:00-07:00 (the offset is in the current time line of the context). It is sent as a message then."
effect = "local"
undo = "undo_remind_me"
[actions.input]
type = "object"
required = ["text", "at"]
additionalProperties = false
[actions.input.properties.text]
type = "string"
minLength = 1
description = "What to remind him of, e.g. 'call the bank'."
[actions.input.properties.at]
type = "string"
description = "When, ISO 8601 with offset."

[[actions]]
name = "list_reminders"
description = "The reminders still waiting to be sent in the next few days."
effect = "read"
share = true
[actions.input]
type = "object"
additionalProperties = false
[actions.input.properties.days]
type = "integer"
minimum = 1
maximum = 365
default = 7

[[actions]]
name = "sent_between"
description = "For other apps: the reminders that went out in [start, end)."
effect = "read"
share = true
tool = false
[actions.input]
type = "object"
required = ["start", "end"]
additionalProperties = false
[actions.input.properties.start]
type = "string"
description = "ISO 8601 with offset; included."
[actions.input.properties.end]
type = "string"
description = "ISO 8601 with offset; excluded."

[[actions]]
name = "cancel_reminder"
description = "Cancel a reminder that has not been sent yet, by its number (from list_reminders)."
effect = "local"
undo = "undo_cancel_reminder"
[actions.input]
type = "object"
required = ["id"]
additionalProperties = false
[actions.input.properties.id]
type = "integer"

[[jobs]]
name = "deliver"
title = "reminder delivery"
description = "Send reminders that have come due."
handler = "deliver_due"
kind = "deliver"
every = "15m"
quiet = "ignore"
timeout_s = 30
